<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin &mdash; FORA Pickleball</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  main.admin { max-width: 1100px; }
  .login-box { max-width: 340px; margin: 60px auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 24px; box-shadow: 0 2px 10px rgba(15,23,30,0.05); }
  .login-box h2 { margin-top: 0; }
  table.list { width: 100%; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table.list th, table.list td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; text-align: left; }
  table.list th { background: var(--header-bg); }
  table.list tr:last-child td { border-bottom: none; }
  .status-badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; }
  .status-confirmed { background: var(--accent-green-soft); color: #0d7a37; }
  .status-pending { background: var(--accent-amber-soft); color: var(--accent-amber); }
  .status-rejected { background: var(--accent-red-soft); color: var(--accent-red); }
  .status-cancelled { background: var(--gray-soft); color: var(--muted); }
  .status-blocked { background: var(--gray-soft); color: var(--muted); }
  .thumb { width: 46px; height: 46px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; display: block; }
  .row-actions button.confirm { background: var(--accent-green-soft); border-color: var(--accent-green-border); color: #0d7a37; }
  .row-actions button.reject { background: var(--accent-red-soft); border-color: var(--accent-red-border); color: var(--accent-red); }
  .lightbox { position: fixed; inset: 0; background: rgba(15,23,30,0.75); display: flex; align-items: center; justify-content: center; z-index: 80; cursor: zoom-out; padding: 24px; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .row-actions button { margin-right: 6px; padding: 5px 9px; font-size: 0.78rem; border-radius: 6px; border: 1px solid var(--border); background: var(--header-bg); color: var(--text); cursor: pointer; }
  .row-actions button:hover { filter: brightness(0.96); }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .toolbar-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  select, .toolbar input[type="text"] { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 7px 10px; border-radius: 8px; font-size: 0.88rem; }
  .block-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 20px; background: var(--card-bg); border: 1px solid var(--border); padding: 12px; border-radius: 10px; }
  .block-form input, .block-form select { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 7px 9px; border-radius: 8px; font-size: 0.86rem; }
  .block-form button { background: var(--accent-green); color: #fff; font-weight: 600; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  .muted { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<header class="site">
  <h1>🏓 Admin Dashboard</h1>
  <p>Manage FORA Pickleball court bookings</p>
</header>

<div class="login-box" id="loginBox">
  <h2>Admin login</h2>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" />
  </div>
  <div class="error-msg" id="loginError"></div>
  <button class="btn primary" id="loginBtn" style="width:100%;margin-top:8px;">Log in</button>
</div>

<main class="admin hidden" id="adminMain">
  <div class="block-form">
    <strong style="margin-right:4px;">Block a slot</strong>
    <select id="blockCourt"></select>
    <input type="date" id="blockDate" />
    <select id="blockHour"></select>
    <input type="text" id="blockNotes" placeholder="Reason (optional)" />
    <button id="blockBtn">Block</button>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <label class="muted">Filter:</label>
      <select id="filterStatus">
        <option value="pending" selected>Pending review</option>
        <option value="all">All statuses</option>
        <option value="confirmed">Confirmed</option>
        <option value="rejected">Rejected</option>
        <option value="cancelled">Cancelled</option>
        <option value="blocked">Blocked</option>
      </select>
      <input type="text" id="filterDate" placeholder="Filter by date (YYYY-MM-DD)" />
    </div>
    <button class="btn ghost" id="refreshBtn" style="flex:none;padding:8px 14px;">Refresh</button>
  </div>

  <div class="grid-wrap" style="overflow-x:auto;">
    <table class="list" id="bookingTable">
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Court</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Proof</th>
          <th>Notes</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="bookingTbody"></tbody>
    </table>
  </div>
</main>

<div class="lightbox hidden" id="lightbox"><img id="lightboxImg" alt="Payment screenshot" /></div>

<div class="toast hidden" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
