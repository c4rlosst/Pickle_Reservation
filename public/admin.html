<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin &mdash; FORA Pickleball</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<style>
  main.admin { max-width: 1100px; padding-top: 4px; }

  /* --- Admin header: quiet wordmark + court-line divider (no emoji) --- */
  header.site {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 18px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .site-header-action {
    flex: none;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
  }
  .site-header-action:hover { border-color: var(--border-strong); background: var(--surface-2); }
  .site-header-action:active { transform: scale(0.96); }
  .change-pw-title { margin: 0 0 16px; font-size: 1.05rem; font-weight: 800; color: var(--ink); }
  .change-pw-label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--muted); margin: 12px 0 6px; }
  .change-pw-label:first-of-type { margin-top: 0; }
  .change-pw-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.92rem;
    box-sizing: border-box;
  }
  .change-pw-input:focus { outline: none; border-color: var(--green-strong); }
  #changePasswordModal .error-msg { margin-top: 10px; }
  .site-brand { display: flex; align-items: center; gap: 12px; }
  .site-mark {
    width: 30px; height: 30px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: var(--green-strong);
    color: #fff;
    font-size: 15px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 0;
  }
  header.site h1 {
    margin: 0;
    font-size: 1.32rem;
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  header.site h1 .site-suffix { font-weight: 600; color: var(--muted-2); margin-left: 2px; }
  header.site p { margin: 3px 0 0; color: var(--muted); font-size: 0.88rem; }
  .site-divider { max-width: 1100px; margin: 0 auto 28px; padding: 0 24px; }
  .site-divider-line { height: 1px; background: var(--border-strong); }

  .login-box { max-width: 340px; margin: 60px auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 24px; box-shadow: 0 2px 10px rgba(15,23,30,0.05); }
  .login-box h2 { margin-top: 0; }

  /* --- Block a slot / toolbar: one consistent input + label language --- */
  .panel-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-right: 2px;
  }
  .block-form-label {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--ink);
    margin-right: 4px;
  }
  .block-form {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-bottom: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: var(--radius-md);
  }
  .block-form input, .block-form select,
  select, .toolbar input[type="text"] {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    font-size: 0.86rem;
    font-family: var(--font-body);
  }
  .block-form input:focus, .block-form select:focus,
  select:focus, .toolbar input[type="text"]:focus {
    outline: none;
    border-color: var(--green-strong);
  }
  /* The browser's own calendar icon on <input type="date"> sits right at
     the field's edge and can be maddeningly small/imprecise to click,
     especially at non-100% zoom -- some browsers barely render it at
     all. A dedicated, full-size button that calls showPicker() gives a
     reliable, big target that always opens the same native picker. */
  /* CSS alone can't reliably hide the browser's own calendar icon on
     <input type="date"> -- ::-webkit-calendar-picker-indicator { display:
     none } is honored inconsistently across Chromium/Edge/Electron
     builds, so it kept showing up next to our own .date-field-btn as a
     second icon no matter what we tried there. Instead of fighting that,
     .date-field has a fixed width and clips its overflow, while the
     input itself is rendered wider than that box -- pushing the native
     icon physically outside the visible, clipped area. Nothing here
     depends on a browser choosing to honor a hiding rule; it's just
     layout math, so it's reliable everywhere. */
  .date-field {
    position: relative;
    display: inline-flex;
    align-items: center;
    width: 150px;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
  }
  /* The input supplies its own border/background normally (see the
     shared .block-form input rule above) -- since it's now wider than
     its clipping wrapper, strip those here so the wrapper's own border
     above is the only visible edge, with no seam where the input's
     right side gets cut off. */
  .date-field input#blockDate {
    width: 178px;
    flex: none;
    padding-right: 34px;
    border: none;
    border-radius: 0;
  }
  .date-field-btn {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
    border: none;
    border-radius: var(--radius-sm);
    color: var(--muted);
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .date-field-btn:hover { background: var(--border); color: var(--ink); }
  .date-field-btn:active { transform: translateY(-50%) scale(0.92); }
  .block-form button#blockBtn {
    background: var(--green-strong);
    color: #fff;
    font-weight: 700;
    font-size: 0.86rem;
    border: none;
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background-color 120ms ease, transform 80ms ease;
  }
  .block-form button#blockBtn:hover { background: #0f6b30; }
  .block-form button#blockBtn:active { transform: scale(0.97); }

  .block-form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .block-hours {
    margin-top: 12px; padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .block-hours-header {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 4px 12px;
    margin-bottom: 8px;
  }
  .block-hours-label {
    font-size: 0.78rem; font-weight: 700; color: var(--muted);
  }
  .block-hours-legend {
    display: flex; align-items: center; flex-wrap: wrap; gap: 3px 12px;
    font-size: 0.74rem; color: var(--muted-2);
  }
  .legend-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 999px;
    margin-right: 5px; vertical-align: middle;
  }
  .legend-dot:not(:first-child) { margin-left: 4px; }
  .legend-available { background: #1a6b3a; }
  .legend-pending { background: #92700f; }
  .legend-booked { background: #a12626; }
  .block-hours-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .hour-chip {
    padding: 6px 12px;
    font-size: 0.8rem;
    font-weight: 600;
    font-family: var(--font-body);
    border-radius: 999px;
    border: 1px solid #bfe3cc;
    background: #f2faf5;
    color: #1a6b3a;
    cursor: pointer;
    transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
  }
  .hour-chip:hover { border-color: var(--green-strong); }
  .hour-chip.selected { background: var(--green-strong); border-color: var(--green-strong); color: #fff; }
  .hour-chip.taken {
    text-decoration: line-through;
    cursor: not-allowed;
  }
  .hour-chip.pending {
    background: #fef6e0;
    border-color: #f3d98b;
    color: #92700f;
  }
  .hour-chip.pending:hover { border-color: #f3d98b; }
  .hour-chip.booked {
    background: #fdecec;
    border-color: #f3b8b8;
    color: #a12626;
  }
  .hour-chip.booked:hover { border-color: #f3b8b8; }

  /* --- Notifications (Telegram) panel -- same shell language as .block-form --- */
  .notify-panel {
    display: flex; gap: 14px; flex-wrap: wrap; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 14px 16px;
    border-radius: var(--radius-md);
  }
  .notify-panel-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .notify-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted-2); }
  .notify-dot.on { background: var(--green-strong); }
  .notify-status-text { font-size: 0.86rem; font-weight: 700; color: var(--ink); }
  .notify-status-sub { font-size: 0.8rem; color: var(--muted); margin-top: 1px; }
  .notify-panel button {
    background: var(--green-strong); color: #fff; font-weight: 700; font-size: 0.86rem;
    border: none; padding: 9px 16px; border-radius: var(--radius-sm); cursor: pointer;
    transition: background-color 120ms ease, transform 80ms ease;
  }
  .notify-panel button:hover { background: #0f6b30; }
  .notify-panel button:active { transform: scale(0.97); }
  .notify-panel button.ghost { background: none; color: var(--muted); border: 1px solid var(--border); }
  .notify-panel button.ghost:hover { background: var(--surface-2); color: var(--ink); }
  .notify-link-step {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 12px; font-size: 0.84rem; color: var(--text);
  }
  .notify-link-code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-weight: 700; font-size: 0.9rem; letter-spacing: 0.02em;
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 8px;
  }
  .notify-link-step a { color: var(--green-strong); font-weight: 700; text-decoration: none; }
  .notify-link-step a:hover { text-decoration: underline; }

  .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .reservation-count { color: var(--muted); font-size: 0.85rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .toolbar-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #filterDate { min-width: 210px; }
  #refreshBtn {
    flex: none; background: none; border: none; color: var(--green-strong);
    font-weight: 700; font-size: 0.86rem; cursor: pointer; padding: 6px 4px;
  }
  #refreshBtn:hover { text-decoration: underline; }

  /* --- Table: quiet header rule, no cell background, dot-based status ---
     Fixed layout so the table always fits in one frame (no horizontal
     scroll needed); long text truncates with an ellipsis instead of
     wrapping or pushing columns wider than the page. */
  table.list { width: 100%; table-layout: fixed; border-collapse: collapse; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
  table.list th, table.list td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 0.87rem; text-align: left; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.list col.col-date { width: 10%; }
  table.list col.col-time { width: 16%; }
  table.list col.col-court { width: 12%; }
  table.list col.col-name { width: 12%; }
  table.list col.col-contact { width: 15%; }
  table.list col.col-proof { width: 7%; }
  table.list col.col-notes { width: 4%; }
  table.list col.col-status { width: 10%; }
  table.list col.col-actions { width: 14%; }
  table.list td:nth-child(4) > div.muted { overflow: hidden; text-overflow: ellipsis; }
  table.list td[data-label="Notes"] { text-align: center; }
  table.list td[data-label="Time"] { white-space: normal; }
  .notes-icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: none;
    background: transparent;
    border-radius: var(--radius-sm);
    color: var(--muted);
    cursor: pointer;
    transition: background-color 120ms ease, transform 120ms ease, color 120ms ease;
  }
  .notes-icon-btn:hover { color: var(--ink); }
  .notes-icon-btn svg { display: block; }
  .notes-icon-btn:hover { background: var(--surface-2); }
  .notes-icon-btn:active { transform: scale(0.96); }
  .notes-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--green-soft); }
  table.list th {
    background: none;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    border-bottom: 1px solid var(--border-strong);
  }
  table.list tr:last-child td { border-bottom: none; }
  table.list td { font-variant-numeric: tabular-nums; }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    text-transform: capitalize;
    white-space: nowrap;
  }
  .status-badge::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex: none;
  }
  .status-confirmed { color: var(--green-strong); }
  .status-pending { color: var(--accent-amber); }
  .status-rejected { color: var(--danger); }
  .status-cancelled, .status-blocked { color: var(--muted); }

  .thumb {
    width: 40px; height: 40px; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--border);
    cursor: zoom-in; display: block;
    transition: transform 120ms ease, opacity 120ms ease;
  }
  .thumb:hover { transform: scale(1.06); opacity: 0.92; }

  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; max-width: 100%; }
  .row-actions button {
    margin: 0;
    max-width: 100%;
    padding: 6px 11px;
    font-size: 0.78rem;
    font-weight: 700;
    font-family: var(--font-body);
    border-radius: 7px;
    border: 1px solid var(--border-strong);
    background: none;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
  }
  .row-actions button:hover { color: var(--ink); background: var(--surface-2); }
  .row-actions button.confirm {
    background: var(--green-strong);
    border-color: var(--green-strong);
    color: #fff;
  }
  .row-actions button.confirm:hover { background: #0f6b30; border-color: #0f6b30; }
  .row-actions button.reject:hover { color: var(--danger); border-color: var(--danger); background: #fdecec; }

  .lightbox { position: fixed; inset: 0; background: rgba(15,23,30,0.75); display: flex; align-items: center; justify-content: center; z-index: 80; cursor: zoom-out; padding: 24px; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  .text-lightbox-card {
    background: var(--card-bg);
    border-radius: var(--radius-md);
    padding: 20px 22px;
    max-width: 420px;
    max-height: 100%;
    overflow-y: auto;
    cursor: auto;
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--text);
    white-space: pre-line;
  }

  .confirm-modal-card { max-width: 380px; display: flex; flex-direction: column; gap: 14px; white-space: normal; }
  .confirm-modal-msg { margin: 0; font-size: 0.92rem; line-height: 1.5; color: var(--text); }
  .confirm-modal-input {
    width: 100%;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 10px 11px;
    font-family: var(--font);
    font-size: 0.88rem;
    resize: vertical;
  }
  .confirm-modal-input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
  .confirm-modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .confirm-modal-actions button {
    padding: 9px 16px;
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    border: 1px solid var(--border-strong);
    background: var(--card-bg);
    color: var(--text);
    transition: background-color 120ms ease, transform 120ms ease;
  }
  .confirm-modal-actions button:active { transform: scale(0.96); }
  .confirm-modal-cancel:hover { background: var(--surface-2); }
  .confirm-modal-ok { background: var(--green); border-color: var(--green); color: #06210f; }
  .confirm-modal-ok:hover { background: #0f6b30; border-color: #0f6b30; color: #fff; }
  .confirm-modal-ok.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
  .confirm-modal-ok.danger:hover { background: #b91c1c; border-color: #b91c1c; }

  .muted { color: var(--muted); font-size: 0.85rem; }

  /* --- Mobile: the fixed-column table becomes a stack of cards ---
     table-layout: fixed is great on desktop but has no room to give
     on a phone; below this width each row becomes its own card with
     a label above every value instead of a truncated column. */
  .card-toggle-btn { display: none; }

  @media (max-width: 720px) {
    main.admin { padding-left: 12px; padding-right: 12px; }
    header.site, .site-divider { padding-left: 12px; padding-right: 12px; }

    .toolbar { justify-content: flex-start; }
    #refreshBtn { margin-left: auto; }

    .grid-wrap { overflow-x: visible; }
    table.list {
      table-layout: auto;
      display: block;
      border: none;
      background: none;
      border-radius: 0;
    }
    table.list colgroup { display: none; }
    table.list thead { display: none; }
    table.list tbody { display: block; }

    /* Card per booking. Fields pair up two-to-a-row (Date+Time,
       Court+Name, ...) instead of stacking one per line, and the
       verification-only fields (Contact, Proof, Notes) start hidden
       behind "Show details" so the card reads at a glance. */
    table.list tr {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: stretch;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      margin-bottom: 12px;
      padding: 4px 14px;
    }
    table.list td {
      display: block;
      width: auto;
      max-width: none;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
    }
    table.list tr td:last-child { border-bottom: none; }
    table.list td:empty { display: none; }
    table.list td[data-collapsible] { display: none; }
    table.list tr.expanded td[data-collapsible] { display: block; }
    table.list tr.expanded td[data-collapsible]:empty { display: none; }
    table.list td[data-label="Notes"],
    table.list td[data-label="Status"],
    table.list td[data-label="Actions"] { grid-column: 1 / -1; }
    table.list td::before {
      content: attr(data-label);
      display: block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 4px;
    }
    /* Proof needs flex (thumb + label) only once it's actually shown;
       must win the specificity tie against the generic collapsible
       block-display rule above, so it's declared after it. */
    table.list tr.expanded td[data-label="Proof"] { display: flex; align-items: center; gap: 10px; }
    table.list td[data-label="Proof"]::before { margin-bottom: 0; }

    .row-actions { flex-direction: column; }
    .row-actions button { width: 100%; padding: 10px 14px; font-size: 0.85rem; }
    .row-actions button.card-toggle-btn {
      display: block;
      background: none;
      border: none;
      color: var(--green-strong);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 2px 0 10px;
      text-align: left;
      cursor: pointer;
    }
    .row-actions button.card-toggle-btn:hover { text-decoration: underline; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="site-brand">
    <span class="site-mark" aria-hidden="true" id="siteMark">F</span>
    <div>
      <h1><span id="siteVenueName">FORA</span> <span class="site-suffix">Admin</span></h1>
      <p id="siteVenueSub">Manage FORA Pickleball court bookings</p>
    </div>
  </div>
  <button type="button" class="site-header-action hidden" id="changePasswordBtn">Change password</button>
</header>
<div class="site-divider" aria-hidden="true"><div class="site-divider-line"></div></div>

<div class="login-box" id="loginBox">
  <h2>Admin login</h2>
  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" />
  </div>
  <div class="error-msg" id="loginError"></div>
  <button class="btn primary" id="loginBtn" style="width:100%;margin-top:8px;">Log in</button>
</div>

<main class="admin hidden" id="adminMain">
  <div class="block-form">
    <div class="block-form-row">
      <strong class="block-form-label">Block a slot</strong>
      <select id="blockCourt"></select>
      <div class="date-field">
        <input type="date" id="blockDate" />
        <button type="button" class="date-field-btn" id="blockDateBtn" aria-label="Open calendar">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </button>
      </div>
      <input type="text" id="blockNotes" placeholder="Reason (optional)" />
      <button id="blockBtn">Block</button>
    </div>
    <div class="block-hours">
      <div class="block-hours-header">
        <span class="block-hours-label" id="blockHoursLabel">Select times</span>
        <span class="block-hours-legend">
          <span class="legend-dot legend-available"></span>Available
          <span class="legend-dot legend-pending"></span>Pending
          <span class="legend-dot legend-booked"></span>Booked
        </span>
      </div>
      <div class="block-hours-chips" id="blockHours"></div>
    </div>
  </div>

  <div class="notify-panel" id="notifyPanel">
    <div class="notify-panel-left">
      <span class="notify-dot" id="notifyDot"></span>
      <div>
        <div class="notify-status-text" id="notifyStatusText">Checking notifications&hellip;</div>
        <div class="notify-status-sub" id="notifyStatusSub"></div>
      </div>
    </div>
    <div id="notifyActions"></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <label class="muted">Filter:</label>
      <select id="filterStatus">
        <option value="pending" selected>Pending review</option>
        <option value="all">All statuses</option>
        <option value="confirmed">Confirmed</option>
        <option value="rejected">Rejected</option>
        <option value="cancelled">Cancelled</option>
        <option value="blocked">Blocked</option>
      </select>
      <input type="text" id="filterDate" placeholder="Filter by date (YYYY-MM-DD)" />
      <span class="reservation-count" id="reservationCount"></span>
    </div>
    <button class="btn ghost" id="refreshBtn" style="flex:none;padding:8px 14px;">Refresh</button>
  </div>

  <div class="grid-wrap" style="overflow-x:auto;">
    <table class="list" id="bookingTable">
      <colgroup>
        <col class="col-date" /><col class="col-time" /><col class="col-court" />
        <col class="col-name" /><col class="col-contact" /><col class="col-proof" />
        <col class="col-notes" /><col class="col-status" /><col class="col-actions" />
      </colgroup>
      <thead>
        <tr>
          <th>Date</th>
          <th>Time</th>
          <th>Court</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Proof</th>
          <th title="Notes" aria-label="Notes"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="13" y2="17"></line></svg></th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="bookingTbody"></tbody>
    </table>
  </div>
</main>

<div class="lightbox hidden" id="lightbox"><img id="lightboxImg" alt="Payment screenshot" /></div>
<div class="lightbox hidden" id="textLightbox"><div class="text-lightbox-card" id="textLightboxContent"></div></div>

<div class="lightbox hidden" id="changePasswordModal">
  <div class="text-lightbox-card confirm-modal-card" role="dialog" aria-modal="true">
    <h3 class="change-pw-title">Change admin password</h3>
    <form id="changePasswordForm">
      <label class="change-pw-label" for="cpCurrent">Current password</label>
      <input class="change-pw-input" type="password" id="cpCurrent" autocomplete="current-password" required />
      <label class="change-pw-label" for="cpNew">New password</label>
      <input class="change-pw-input" type="password" id="cpNew" autocomplete="new-password" minlength="8" required />
      <label class="change-pw-label" for="cpConfirm">Confirm new password</label>
      <input class="change-pw-input" type="password" id="cpConfirm" autocomplete="new-password" minlength="8" required />
      <div class="error-msg" id="changePasswordError"></div>
      <div class="confirm-modal-actions">
        <button type="button" class="confirm-modal-cancel" id="changePasswordCancel">Cancel</button>
        <button type="submit" class="confirm-modal-ok" id="changePasswordSubmit">Save password</button>
      </div>
    </form>
  </div>
</div>

<div class="lightbox hidden" id="confirmModal">
  <div class="text-lightbox-card confirm-modal-card" role="dialog" aria-modal="true">
    <p class="confirm-modal-msg" id="confirmModalMsg"></p>
    <textarea class="confirm-modal-input hidden" id="confirmModalInput" rows="2"></textarea>
    <div class="confirm-modal-actions">
      <button type="button" class="confirm-modal-cancel" id="confirmModalCancel">Cancel</button>
      <button type="button" class="confirm-modal-ok" id="confirmModalOk">OK</button>
    </div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
